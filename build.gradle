plugins { id 'com.android.application' }

android {
    namespace 'com.webapp.herostudios'
    compileSdk 35

    ndkVersion '27.2.12479018'

    defaultConfig {
        ndk { abiFilters 'arm64-v8a' }
        applicationId 'com.webapp.herostudios'
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName '0.5.14'
    }

    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}


tasks.register('prepareHeroAndroidDependencies', Exec) {
    workingDir rootProject.projectDir
    commandLine 'bash', 'build-environment/scripts/prepare-android-dependencies.sh'
}
tasks.register('buildHeroAndroidFFmpeg', Exec) {
    dependsOn 'prepareHeroAndroidDependencies'
    workingDir rootProject.projectDir
    environment 'ANDROID_NDK_HOME', (System.getenv('ANDROID_NDK_HOME') ?: "${System.getenv('ANDROID_SDK_ROOT') ?: System.getenv('ANDROID_HOME')}/ndk/27.2.12479018")
    commandLine 'bash', 'build-environment/scripts/build-ffmpeg-android.sh'
}
tasks.named('preBuild').configure { dependsOn 'buildHeroAndroidFFmpeg' }
afterEvaluate {
    tasks.matching { it.name.startsWith('merge') && (it.name.endsWith('Assets') || it.name.endsWith('NativeLibs')) }.configureEach {
        dependsOn tasks.matching { it.name.startsWith('externalNativeBuild') }
    }
}
